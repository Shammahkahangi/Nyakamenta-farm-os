<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0F1115;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
            /* Allow dragging the splash */
        }

        .splash-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-img {
            width: 160px;
            height: auto;
            margin-bottom: 6px;
        }

        .app-name {
            font-size: 13px;
            font-weight: 700;
            color: #8A9099;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .app-sub {
            font-size: 10px;
            font-weight: 400;
            color: #4E5560;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Progress bar */
        .progress-wrap {
            margin-top: 36px;
            width: 200px;
            height: 2px;
            background: #1E2229;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #B8960C, #F0C040);
            border-radius: 99px;
            animation: load 3.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes load {
            0% {
                width: 0%;
            }

            30% {
                width: 42%;
            }

            60% {
                width: 71%;
            }

            85% {
                width: 88%;
            }

            100% {
                width: 100%;
            }
        }

        .status-text {
            margin-top: 14px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #4E5560;
            height: 14px;
        }

        /* Version badge */
        .version {
            position: fixed;
            bottom: 18px;
            right: 18px;
            font-size: 9px;
            font-weight: 600;
            color: #2A2F38;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="splash-wrap">
        <img class="logo-img" src="../assets/Golden agricultural logo design.png" alt="Agrisys Logo" />
        <div class="app-name">Coffee Estate OS</div>
        <div class="app-sub">Operations Intelligence System</div>

        <div class="progress-wrap">
            <div class="progress-bar" id="bar"></div>
        </div>
        <div class="status-text" id="status">Initialising system…</div>
    </div>

    <div class="version">v1.0.0 · Uganda</div>

    <script>
        // Cycle status messages in sync with the progress bar animation
        const messages = [
            'Initialising system…',
            'Loading estate data…',
            'Calibrating modules…',
            'Connecting AI engine…',
            'Optimising workspace…',
            'Ready.',
        ];
        const delays = [0, 800, 1600, 2400, 3200, 3800];
        const statusEl = document.getElementById('status');

        messages.forEach((msg, i) => {
            setTimeout(() => { statusEl.textContent = msg; }, delays[i]);
        });
    </script>
</body>

</html>
