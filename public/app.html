<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Estate OS — Operations Intelligence System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <link rel="stylesheet" href="../styles/styles.css" />
  <link rel="stylesheet" href="../styles/coffee-gateway-theme-overrides.css" />
  <link rel="stylesheet" href="../styles/estate-ui-shell.css" />
</head>

<body>
  <div id="app">

    <!-- ═══════════════ SIDEBAR ═══════════════ -->
    <aside id="sidebar">
      <div class="sidebar-brand-row">
        <div class="sidebar-logo">
          <img src="../assets/Golden agricultural logo design.png" alt="Agrisys"
            class="sidebar-logo-img" draggable="false" />
        </div>
        <button type="button" id="sidebar-collapse-btn" class="sidebar-collapse-btn" aria-expanded="true"
          aria-controls="sidebar-nav" title="Collapse sidebar">
          <span class="material-symbols-outlined" aria-hidden="true">keyboard_double_arrow_left</span>
        </button>
      </div>

      <!-- Nav will be injected by app.js -->
      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <!-- User -->
      <div class="sidebar-user">
        <div class="user-avatar">SM</div>
        <div class="user-info">
          <div class="user-name">S. Mbugua</div>
          <div class="user-role">Plant Manager</div>
        </div>
      </div>
    </aside>

    <!-- ═══════════════ MAIN AREA ═══════════════ -->
    <div id="main-area">

      <!-- TOP TOOLBAR -->
      <header id="toolbar"></header>

      <!-- WORKSPACE — modules render here -->
      <main id="workspace"></main>

      <!-- FOOTER STATUS BAR -->
      <footer style="
      height: 28px; flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    ">
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--green-mid);display:inline-block;"></span>
          <span id="footer-time"
            style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">System
            Online</span>
          <div style="width:1px;height:12px;background:var(--border-subtle);margin:0 10px;"></div>
          <button id="sync-btn" title="Sync with Cloud"
            style="background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; gap:4px; padding:0;">
            <span class="material-symbols-outlined" style="font-size:14px;">cloud_sync</span>
            <span style="font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em;">Sync
              Cloud</span>
          </button>
        </div>
        <div style="display:flex;gap:20px;">
          <span
            style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);cursor:pointer;"
            onmouseover="this.style.color='var(--text-secondary)'" onmouseout="this.style.color='var(--text-muted)'">API
            Logs</span>
          <span
            style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);cursor:pointer;"
            onmouseover="this.style.color='var(--text-secondary)'"
            onmouseout="this.style.color='var(--text-muted)'">Audit Trail</span>
          <span
            style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);cursor:pointer;"
            onmouseover="this.style.color='var(--text-secondary)'"
            onmouseout="this.style.color='var(--text-muted)'">Dispatch ledger</span>
          <a href="#" id="footer-sign-out" title="Sign out"
            style="display:none;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);text-decoration:none;cursor:pointer;">Sign out</a>
          <span
            style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">v1.0.0
            · Uganda</span>
        </div>
      </footer>

    </div>
  </div>

  <!-- App entry  -->
  <script type="module" src="../src/renderer/app.js"></script>
</body>

</html>
